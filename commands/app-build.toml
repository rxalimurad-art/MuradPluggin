description = "The build loop — runs ready board tickets through developer → reviewer → QA until done or blocked; $ARGUMENTS optionally limits to specific ticket IDs"
prompt = "Read commands/app-build.md and agents/*.md in this extension's own directory (murad-ios-studio) and follow commands/app-build.md exactly, stage by stage. This command takes an argument ([ticket-id ...]): treat {{args}} below as $ARGUMENTS in that file.\n\nThis runtime has no isolated subagent dispatch. Wherever that file says \"delegate to `<role>`\", instead open agents/<role>.md in this same extension directory, adopt that persona for the step in the current thread, then continue. See the studio-pipeline skill (skills/studio-pipeline/SKILL.md) for the full pipeline contract.\n\nUser's input: {{args}}"
