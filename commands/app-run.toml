description = "The autonomous driver — takes an app idea from $ARGUMENTS through the full pipeline to App Store submission, pausing only at the scope-lock and ship gates"
prompt = "Read commands/app-run.md and agents/*.md in this extension's own directory (murad-ios-studio) and follow commands/app-run.md exactly, stage by stage. This command takes an argument (<one-line app idea>): treat {{args}} below as $ARGUMENTS in that file.\n\nThis runtime has no isolated subagent dispatch. Wherever that file says \"delegate to `<role>`\", instead open agents/<role>.md in this same extension directory, adopt that persona for the step in the current thread, then continue. See the studio-pipeline skill (skills/studio-pipeline/SKILL.md) for the full pipeline contract.\n\nUser's input: {{args}}"
