description = "Release stage — prepares all store assets and the TestFlight/App Store upload via the release manager and QA sign-off, then stops at GATE 2 for user confirmation; $ARGUMENTS optionally sets the version"
prompt = "Read commands/app-ship.md and agents/*.md in this extension's own directory (murad-ios-studio) and follow commands/app-ship.md exactly, stage by stage. This command takes an argument ([version]): treat {{args}} below as $ARGUMENTS in that file.\n\nThis runtime has no isolated subagent dispatch. Wherever that file says \"delegate to `<role>`\", instead open agents/<role>.md in this same extension directory, adopt that persona for the step in the current thread, then continue. See the studio-pipeline skill (skills/studio-pipeline/SKILL.md) for the full pipeline contract.\n\nUser's input: {{args}}"
